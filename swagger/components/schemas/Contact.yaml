type: object
required:
  - name
  - email
properties:
  id:
    type: string
    example: "66e0ad112233445566778899"
  name:
    type: string
    example: "Ada Lovelace"
  email:
    type: string
    format: email
    example: "ada@example.com"
  phone:
    type: string
    example: "+90 555 555 55 55"
  favorite:
    type: boolean
    default: false
